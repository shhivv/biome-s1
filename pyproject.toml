[project]
name = "taiga-s1"
version = "0.1.0"
description = "System-1 next-action model for FreeCAD: option-attention scorer over structured CAD state"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy", "safetensors", "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest"]
ax = ["pyobjc-framework-ApplicationServices; sys_platform == 'darwin'"]  # scripts/mesa_ax.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freecad_s1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
